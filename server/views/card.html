<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawzoo</title>
<style>
  :root {
    --bg: #fffaf3; --surface: #ffffff; --ink: #2b211a; --muted: #7a6a5d; --line: #ecdfd0;
    --accent: #e8743b; --accent-ink: #ffffff; --warn: #b4521f; --warn-bg: #fdeee3; --ok: #2f7d5b;
    --radius: 18px; color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #1d1814; --surface: #27201a; --ink: #f6ece2; --muted: #b9a796; --line: #3b3129;
    --accent: #f08a54; --accent-ink: #1d1814; --warn: #f3a273; --warn-bg: #3a2519; --ok: #7fc8a3; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--ink); font: 15px/1.45 "Lexend", "Segoe UI", system-ui, sans-serif; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 12px; }
  header h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; }
  .eyebrow { margin: 0; color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  .muted { color: var(--muted); margin: 2px 0 0; }
  .small { font-size: 12px; }
  .facts { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; }
  .facts li { display: flex; gap: 10px; align-items: baseline; }
  .facts b { min-width: 86px; color: var(--muted); font-weight: 500; font-size: 13px; }
  .facts li.warn { color: var(--warn); }
  .alert { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(110px, 1fr); gap: 10px; overflow-x: auto; margin-top: 14px; padding-bottom: 4px; }
  .moment { margin: 0; }
  .thumb { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.small { width: 72px; flex: none; }
  .time { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 6px; }
  figcaption { font-size: 12px; margin-top: 4px; color: var(--muted); }
  .meter { height: 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); margin-top: 14px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
  .meter.low span { background: var(--warn); }
  .rows { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .row { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 14px; }
  .row.pick { border-color: var(--accent); }
  .grow { flex: 1; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn { font: inherit; font-weight: 600; border-radius: 999px; padding: 9px 16px; cursor: pointer; border: 1px solid transparent; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn:disabled { opacity: .55; cursor: progress; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  footer { margin-top: 14px; display: flex; justify-content: flex-end; }
  .brand { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">/*__CARD_JS__*/</script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawzoo TV</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #15110e; --surface: #1d1814; --raised: #27201a; --ink: #f6ece2; --muted: #b9a796; --line: #3b3129; --accent: #f08a54; --warn: #f3a273; --warn-bg: #3a2519; color-scheme: dark; }
  :root[data-theme="light"] { --bg: #f6efe6; --surface: #fffaf3; --raised: #ffffff; --ink: #2b211a; --muted: #7a6a5d; --line: #e6d8c7; --accent: #e8743b; --warn: #b4521f; --warn-bg: #fdeee3; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Lexend", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .tv { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .home { flex: 1; display: grid; place-content: center; text-align: center; gap: 20px; padding: 5vh 6vw; }
  .home img { width: 9vh; height: 9vh; margin: 0 auto; }
  .home h1 { margin: 0; font-size: 7vh; letter-spacing: -0.02em; }
  .home ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.2vh; font-size: 2.8vh; color: var(--muted); }
  .play { justify-self: center; margin-top: 2vh; font: inherit; font-size: 3vh; font-weight: 600; padding: 1.6vh 4vh; border-radius: 999px; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; }
  .play:focus { outline: 0.6vh solid var(--ink); outline-offset: 0.6vh; }
  .player { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .frame { position: relative; flex: 1; min-height: 0; background: #000; }
  .frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .overlay { position: absolute; left: 4vw; bottom: 4vh; right: 4vw; display: flex; flex-direction: column; gap: .6vh; }
  .overlay .cap { font-size: 4.4vh; font-weight: 600; color: #fff; }
  .overlay .meta { font-size: 2.4vh; color: #e7dccf; }
  .overlay span { background: rgba(0,0,0,.55); padding: .4vh 1.2vh; border-radius: 1vh; width: fit-content; }
  .rail { display: flex; gap: 1.4vw; overflow-x: auto; padding: 2vh 4vw 3vh; background: var(--surface); scrollbar-width: none; }
  .chapter { flex: none; width: 15vw; display: grid; gap: .6vh; text-align: left; background: transparent; color: var(--ink); border: 0.4vh solid transparent; border-radius: 1.6vh; padding: .6vh; font: inherit; cursor: pointer; }
  .chapter[aria-current="true"], .chapter:focus { border-color: var(--accent); outline: 0; }
  .chapter .thumb { aspect-ratio: 16/9; border-radius: 1vh; background: var(--raised) center/cover no-repeat; }
  .chapter .t { font-size: 1.8vh; color: var(--muted); }
  .chapter .c { font-size: 2vh; line-height: 1.25; }
  .alert { position: fixed; inset: 0; background: var(--warn-bg); display: grid; grid-template-columns: 1.2fr 1fr; gap: 4vw; align-items: center; padding: 6vh 6vw; }
  .alert img { width: 100%; border-radius: 2vh; border: 0.5vh solid var(--warn); background: #000; aspect-ratio: 16/9; object-fit: cover; }
  .alert h2 { margin: 0 0 2vh; color: var(--warn); font-size: 6vh; }
  .alert p { margin: 0; font-size: 3.4vh; line-height: 1.35; }
  .alert .hint { margin-top: 3vh; font-size: 2.4vh; color: var(--muted); }
  .badge { position: fixed; top: 2vh; right: 2vw; font-size: 1.8vh; color: var(--muted); }
</style>
</head>
<body>
<div class="tv">
  <section id="home" class="home">
    <img src="logo.svg" alt="">
    <h1 id="title">Today</h1>
    <ul id="summary"></ul>
    <button id="play" class="play">Play the Day</button>
  </section>
  <section id="player" class="player" hidden>
    <div class="frame">
      <video id="video" muted playsinline></video>
      <img id="still" alt="" hidden>
      <div class="overlay"><span id="caption" class="cap"></span><span id="meta" class="meta"></span></div>
    </div>
    <nav id="rail" class="rail" aria-label="Moments"></nav>
  </section>
  <section id="alert" class="alert" hidden role="alert">
    <img id="alert-still" alt="Front door camera">
    <div>
      <h2>Biscuit Is Outside</h2>
      <p id="alert-text"></p>
      <p class="hint">Say "She's back inside" when she's home.</p>
    </div>
  </section>
  <span class="badge">Pawzoo TV preview</span>
</div>
<script type="module" src="tv.js"></script>
</body>
</html>
